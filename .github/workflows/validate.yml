name: Validate AI Creative Skill
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional offline QA packages
        run: python -m pip install -r validation/requirements.txt
      - name: Ensure local video tools
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Packaging, registry and harness regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Web Experience unit tests
        run: python -m unittest discover -s src/ai-creative-skill/web/tests -p 'test_*.py' -v
      - name: Install smoke
        run: python src/ai-creative-skill/scripts/smoke_install.py
      - name: Compile Python
        run: python -m compileall -q src/ai-creative-skill
      - name: Rebuild both distributions offline
        run: python packaging/build.py --output-dir dist
      - name: Run validation probes and illustrative simulations
        run: python -m validation.harness --host --check --output build/validation/current.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: build/validation/*.json
          if-no-files-found: warn
          retention-days: 30
