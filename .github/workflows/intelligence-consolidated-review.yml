name: Intelligence unified offline lab
on:
  # Required candidate boundaries must also run when a PR changes only src/,
  # validation/ or packaging/. A path-filtered check can silently be absent.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Single-package synthetic integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install canonical validation requirements
        run: python -m pip install -r validation/requirements.txt
      - name: Run unified Python suite without PYTHONPATH
        run: python -m unittest discover -s experiments -t . -p 'test_*.py' -v
      - name: Verify baseline and candidate checks
        run: |
          python -m validation.release_integrity
          python -m validation.candidate_integrity
          python -m validation.candidate_tests
