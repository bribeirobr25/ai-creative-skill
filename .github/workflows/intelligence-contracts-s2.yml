name: Intelligence S2 contract canary (offline)
on:
  pull_request:
    paths:
      - 'experiments/intelligence_contracts/**'
      - '.github/workflows/intelligence-contracts-s2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: S2 synthetic contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test isolated synthetic shapes without API access
        run: python -m unittest discover -s experiments/intelligence_contracts -p 'test_*.py' -v
