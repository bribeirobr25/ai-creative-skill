name: Project Brain
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  brain-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Records follow brain/CONTRACT.md
        run: python -m brain validate
      - name: Living docs do not call merged PRs open (finding SNAP-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m brain lint-docs
      - name: Brain and finding-guard tests
        run: python -m unittest tests.test_brain tests.test_findings -v
