name: Project Brain
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brain-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Records follow brain/CONTRACT.md
        run: python -m brain validate
      - name: Brain tests
        run: python -m unittest tests.test_brain -v
