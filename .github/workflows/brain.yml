name: Project Brain
on:
  # Pull requests only, including retargeting (edited): a manual run must not report brain-records using only the
  # branch's own code (2026-11-03 audit).
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  brain-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Records also pass the base branch's validator (a PR cannot weaken the check that judges it)
        if: github.event_name == 'pull_request'
        # 2026-10-30 audit: like the publication guard (PR20-P1-4), the enforcing validation runs the base
        # commit's brain/ code over this PR's tree and records, before any PR code runs.
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          check="$RUNNER_TEMP/base-brain"
          mkdir -p "$check"
          git archive HEAD | tar -x -C "$check"
          rm -rf "$check/brain"
          git archive "$BASE_SHA" brain | tar -x -C "$check"
          rm -rf "$check/brain/records"
          # The records judged are the PR's git blobs, not the work tree or the archive: a symlink plus .gitattributes
          # export-subst could otherwise show the base check an unchanged copy (2026-11-04 re-review). Fail on
          # anything that is not a plain folder of plain files.
          if [ "$(git ls-tree HEAD brain/records | cut -d' ' -f1)" != 040000 ]; then
            echo "::error::brain/records must be a plain folder"; exit 1
          fi
          git ls-tree -r -z HEAD -- brain/records/ | while IFS=$'\t' read -r -d '' meta path; do
            read -r mode _ blob <<< "$meta"
            if [ "$mode" != 100644 ]; then echo "::error::$path must be a plain file (mode $mode)"; exit 1; fi
            mkdir -p "$check/$(dirname "$path")"
            git cat-file blob "$blob" > "$check/$path"
          done
          # Import only the base brain package: -P keeps the working folder off sys.path, so a module the PR adds at
          # the top level (argparse.py, json.py...) cannot shadow the standard library (2026-11-03 audit).
          mkdir -p "$RUNNER_TEMP/brain-path"
          ln -s "$check/brain" "$RUNNER_TEMP/brain-path/brain"
          cd "$check"
          # Rule 5 (no merged record changed or removed) is judged here by the base code too, so a PR that edits its own
          # validator cannot switch it off (2026-11-04 review). The copy has no .git; git reads the checkout's.
          # Bootstrap: a base validator without --base-ref (main before PR #58) cannot judge rule 5, and only the PR's
          # own validator does, in the next step. Once the base has the flag, any failure here fails the check.
          if grep -q -- '--base-ref' "$check/brain/__main__.py"; then
            GIT_DIR="$GITHUB_WORKSPACE/.git" PYTHONPATH="$RUNNER_TEMP/brain-path" python -P -m brain validate --base-ref "$BASE_SHA"
          else
            echo "::warning::bootstrap: the base validator has no --base-ref, so rule 5 is checked only by this PR's own code"
            PYTHONPATH="$RUNNER_TEMP/brain-path" python -P -m brain validate
          fi
      - name: Records follow brain/CONTRACT.md, and no merged record was changed or removed (rule 5)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m brain validate --base-ref "$BASE_SHA"
      - name: Living docs do not call merged PRs open (finding SNAP-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m brain lint-docs
      - name: Brain and finding-guard tests
        run: python -m unittest tests.test_brain tests.test_findings -v
