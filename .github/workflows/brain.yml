name: Project Brain
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  brain-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Records follow brain/CONTRACT.md
        run: python -m brain validate
      - name: Living docs do not call merged PRs open (finding SNAP-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m brain lint-docs
      - name: Brain and finding-guard tests
        run: python -m unittest tests.test_brain tests.test_findings -v
