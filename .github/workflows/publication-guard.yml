name: Publication Safety Guard (candidate)

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-publication-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test redaction and detection rules
        run: python -m unittest discover -s security -p 'test_*.py' -v
      - name: Inspect PR diff without echoing secret values
        if: github.event_name == 'pull_request'
        run: python security/publication_guard.py --range "origin/$GITHUB_BASE_REF...HEAD"
      - name: Fetch all public branch heads for historical coverage
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' > /dev/null 2>&1 || {
            echo "History audit blocked: cannot fetch all public branches"
            exit 2
          }
      - name: Audit reachable Git history without exposing matches
        run: python security/history_audit.py
      - name: Safety note for manual triggers
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual trigger ran guard unit tests only; no PR base was supplied."
