name: Publication Safety Guard (candidate)
on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-publication-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test redaction and detection rules
        run: python -m unittest discover -s security -p 'test_*.py' -v
      - name: Inspect final PR diff AND all commit additions (scanner from the base branch)
        if: github.event_name == 'pull_request'
        # Finding PR20-P1-4: the enforcing scan uses the base branch's copy of security/, so a PR
        # cannot weaken the scanner that judges it. The PR's own copy also runs, so new rules apply at once.
        run: |
          mkdir -p "$RUNNER_TEMP/base-guard"
          git archive "origin/$GITHUB_BASE_REF" security | tar -x -C "$RUNNER_TEMP/base-guard"
          python "$RUNNER_TEMP/base-guard/security/publication_guard.py" \
            --range "origin/$GITHUB_BASE_REF...HEAD" \
            --history-range "origin/$GITHUB_BASE_REF..HEAD"
      - name: Inspect the same range with the PR's scanner
        if: github.event_name == 'pull_request'
        run: |
          python security/publication_guard.py \
            --range "origin/$GITHUB_BASE_REF...HEAD" \
            --history-range "origin/$GITHUB_BASE_REF..HEAD"
      - name: Fetch public heads for MANUAL history audit
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' > /dev/null 2>&1 || {
            echo "Manual history audit blocked: public heads unavailable"
            exit 2
          }
      - name: Manual advisory audit of public branch history
        if: github.event_name == 'workflow_dispatch'
        run: python security/history_audit.py
      - name: Manual audit notice
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual history audit was executed as a separate advisory check."
